name: Ngrok Tunnel

on:
  workflow_dispatch:
    inputs:
      port:
        description: 'Tünellenecek Port (Örn: 80, 3000, 8080)'
        required: true
        default: '80'

jobs:
  ngrok-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Ngrok
        run: |
          # Ngrok'u resmi sitesinden indirip sistem yoluna ekleyelim
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          sudo tar -xzf ngrok.tgz -C /usr/local/bin

      - name: Authenticate Ngrok
        run: |
          # Secrets içine kaydettiğin token ile ngrok hesabını bağla
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start test server (İsteğe bağlı örnek sunucu)
        run: |
          # Test için basit bir sunucu başlatıyoruz (kendi projen varsa bunu silebilirsin)
          echo "<h1>GitHub Actions Ngrok Tunnel Aktif!</h1>" > index.html
          python3 -m http.server ${{ github.event.inputs.port }} &

      - name: Start Ngrok Tunnel
        run: |
          # Ngrok tünelini başlatır ve bağlantının açık kalmasını sağlar
          ngrok http ${{ github.event.inputs.port }}
