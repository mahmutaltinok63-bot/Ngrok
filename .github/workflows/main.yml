name: SOCKS5 Proxy Tunnel

on:
  workflow_dispatch:

jobs:
  proxy-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Ngrok & MicroSocks
        run: |
          # Ngrok kurulumu
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          sudo tar -xzf ngrok.tgz -C /usr/local/bin
          
          # SOCKS5 Proxy sunucusu (microsocks) kurulumu
          sudo apt-get update
          sudo apt-get install -y microsocks

      - name: Authenticate Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start SOCKS5 Server
        run: |
          # 1080 portunda SOCKS5 proxy başlatıyoruz
          microsocks -p 1080 &
          sleep 2

      - name: Start Ngrok TCP Tunnel
        run: |
          # SOCKS5 proxy portunu TCP tüneli olarak ngrok üzerinden açıyoruz
          nohup ngrok tcp 1080 --log=stdout > ngrok.log 2>&1 &
          
          sleep 4
          
          echo "=========================================="
          echo "  FIREFOX İÇİN SOCKS5 PROXY BİLGİLERİNİZ"
          echo "=========================================="
          
          # Ngrok API'den tcp:// sunucu ve port bilgilerini çekiyoruz
          curl -s http://127.0.0.1:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | cut -d'/' -f3
          
          echo "=========================================="
          echo "Tünel açık kalıyor..."
          
          sleep 21600
